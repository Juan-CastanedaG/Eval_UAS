<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007934">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Evaluación operacional – Pilotos UAS EPM</title>
<style>
:root{
  --verde:#007934; --verde-osc:#005a27; --lima:#7AD400; --tinta:#17321F; --gris:#5b6b60; --linea:#d5e2d6;
  --neblina:#eef5ec; --papel:#fff; --rojo:#b3261e; --rojo-s:#fbeceb; --verde-s:#e3f3e8; --ambar:#c77700; --ambar-s:#fff3dc;
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--neblina);color:var(--tinta)}
body{font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lima);outline-offset:2px}
#top{background:var(--papel);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:10}
#top img{height:28px}
#top .tit{flex:1;line-height:1.15}
#top .tit b{display:block;font-size:15px}
#top .tit span{font-size:12px;color:var(--gris)}
#top .ver{font-size:11px;color:var(--gris)}
main{max-width:860px;margin:0 auto;padding:12px 12px 120px}
.hoja{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-bottom:12px}
h1{font-size:21px;margin:2px 0 8px;color:var(--verde-osc)}
h2{font-size:17px;margin:0 0 8px;color:var(--verde-osc)}
.sub{color:var(--gris);font-size:14px}
.btn{border:1.5px solid var(--verde);background:var(--papel);color:var(--verde-osc);border-radius:10px;padding:10px 16px;font-weight:bold;min-height:44px}
.btn.pri{background:var(--verde);color:#fff}
.btn.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn:disabled{opacity:.45}
.btn.chico{min-height:36px;padding:6px 12px;font-size:14px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1.5px solid var(--linea);border-radius:9px;padding:10px;background:#fff;color:var(--tinta);font-size:16px}
textarea{width:100%;resize:vertical}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.fila{grid-template-columns:1fr}}
.msg{border-radius:9px;padding:10px 12px;margin:8px 0;font-size:14px}
.msg.ok{background:var(--verde-s);color:var(--verde-osc)} .msg.err{background:var(--rojo-s);color:var(--rojo)} .msg.info{background:var(--ambar-s);color:#6b4500}
.lista .ev{display:flex;gap:10px;align-items:center;border:1px solid var(--linea);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;width:100%;text-align:left}
.ev .n{flex:1} .ev .n b{display:block} .ev .n span{font-size:13px;color:var(--gris)}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:bold;white-space:nowrap}
.tag.ok{background:var(--verde-s);color:var(--verde)} .tag.mal{background:var(--rojo-s);color:var(--rojo)} .tag.bor{background:var(--ambar-s);color:var(--ambar)} .tag.crit{background:var(--rojo-s);color:var(--rojo);font-size:11px;padding:1px 8px} .tag.pen{background:#e9eef0;color:#45545b}
.pils{display:flex;flex-wrap:wrap;gap:6px}
.pil{border:1.5px solid var(--linea);background:#fff;border-radius:20px;padding:8px 14px;font-weight:bold}
.pil.on{background:var(--verde);border-color:var(--verde);color:#fff}
.sugerido{border:1.5px solid var(--linea);border-radius:10px;padding:8px 12px;background:#fff;text-align:left;width:100%;margin-bottom:6px}
.sugerido b{display:block}
.sugerido span{font-size:13px;color:var(--gris)}
/* evaluación */
#barra{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:9;background:var(--papel);border-bottom:1px solid var(--linea);padding:8px 14px;display:flex;gap:10px;align-items:center;font-size:14px}
#barra .prog{flex:1;height:8px;background:var(--linea);border-radius:4px;overflow:hidden}
#barra .prog i{display:block;height:100%;background:var(--verde)}
.sec{background:var(--papel);border:1px solid var(--linea);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sec>button.cab{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;padding:12px 14px;text-align:left;font-weight:bold;color:var(--verde-osc)}
.sec>button.cab .cnt{margin-left:auto;font-size:13px;color:var(--gris);font-weight:normal}
.sec .cuerpo{display:none;border-top:1px solid var(--linea)}
.sec.abierta .cuerpo{display:block}
.it{padding:12px 14px;border-bottom:1px solid var(--linea)}
.it:last-child{border-bottom:0}
.it .tx{margin-bottom:8px}
.it .tx small{color:var(--gris);margin-right:6px;font-weight:bold}
.est{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.est button{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:9px 4px;font-weight:bold;font-size:14px;min-height:44px}
.est .c.on{background:var(--verde);border-color:var(--verde);color:#fff}
.est .n.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.est .na.on{background:var(--gris);border-color:var(--gris);color:#fff}
.extra{display:flex;gap:8px;margin-top:8px;align-items:flex-start;flex-wrap:wrap}
.extra textarea{flex:1;min-width:200px;border:1.5px solid var(--linea);border-radius:9px;padding:8px;font-size:15px;min-height:42px}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fotos .f{position:relative}
.fotos img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--linea);display:block}
.fotos .x{position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--rojo);color:#fff;font-weight:bold;font-size:17px;line-height:32px;padding:0}
.camara{border:1.5px dashed var(--verde);background:#fff;color:var(--verde-osc);border-radius:9px;padding:8px 12px;font-weight:bold;min-height:42px}
.res{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.res .pts{font-size:52px;font-weight:bold;line-height:1;color:var(--verde-osc)} .res .pts.no{color:var(--rojo)}
.res .ver{font-size:20px;font-weight:bold}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:none;align-items:center;justify-content:center}
#visor.on{display:flex} #visor img{max-width:100%;max-height:100%}
#modal{position:fixed;inset:0;background:rgba(23,50,31,.5);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .caja{background:#fff;border-radius:14px;padding:18px;max-width:520px;width:100%}
/* informe */
.inf table{width:100%;border-collapse:collapse;font-size:14px}
.inf td,.inf th{border:1px solid var(--linea);padding:6px 8px;vertical-align:top;text-align:left}
.inf th{background:var(--neblina)}
.inf .ok{color:var(--verde);font-weight:bold} .inf .mal{color:var(--rojo);font-weight:bold} .inf .na{color:var(--gris)}
.inf .fotos img{width:150px;height:110px}
@media print{
  #top,#barra,.no-print{display:none!important}
  body{background:#fff} main{max-width:none;padding:0}
  .hoja{border:0;padding:0 0 10px}
  .inf .fotos img{width:170px;height:125px}
  .salto{page-break-before:always}
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;position:sticky;top:calc(92px + env(safe-area-inset-top,0px));z-index:8}
.tabs button{border:1.5px solid var(--verde);background:#fff;color:var(--verde-osc);border-radius:10px;padding:10px 6px;font-weight:bold;min-height:48px;line-height:1.2}
.tabs button.on{background:var(--verde);color:#fff}
.tabs button small{display:block;font-weight:normal;font-size:12px}
#fase{font-size:13px;color:var(--verde-osc);font-weight:bold}
#barra .t{font-variant-numeric:tabular-nums;font-weight:bold;font-size:18px}
#barra .t.aviso{color:var(--ambar)} #barra .t.fin{color:var(--rojo)}
.dato{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--gris)}
.dato input{width:90px;border:1.5px solid var(--linea);border-radius:9px;padding:8px;font-size:16px}
.tarj{border:1.5px solid var(--ambar);background:var(--ambar-s);border-radius:10px;padding:10px 12px;margin:10px 14px}
.tarj b{color:#6b4500}
.amb{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 14px 10px}
#mostrar{position:fixed;inset:0;z-index:60;background:var(--verde-osc);color:#fff;display:none;flex-direction:column;justify-content:center;padding:28px;text-align:center}
#mostrar.on{display:flex}
#mostrar .q{font-size:30px;font-weight:bold;line-height:1.3}
#mostrar .p{font-size:16px;opacity:.85;margin-bottom:18px}
#mostrar .c{font-size:14px;opacity:.7;margin-top:30px}
.solo-print{display:none} @media print{.solo-print{display:inline}}
[data-elige]{max-width:100%;min-width:0;text-overflow:ellipsis}
.inf .secs table{margin-bottom:6px}
@page{size:letter;margin:9mm 10mm}
@media print{
  .inf{font-size:10px;line-height:1.22}
  .inf h1{font-size:14px;margin:0 0 4px}
  .inf h2{font-size:11px;margin:5px 0 2px!important}
  .inf table{font-size:10px}
  .inf td,.inf th{padding:1px 4px}
  .inf .tarj{padding:3px 6px;margin:4px 0!important;font-size:10px;line-height:1.22}
  .inf .res{margin:4px 0 2px!important;gap:8px} .inf .res .pts{font-size:26px} .inf .res .ver{font-size:14px}
  .inf .msg{padding:3px 6px;margin:3px 0;font-size:10px}
  .inf .sub{font-size:9.5px}
  .inf .tag.crit{font-size:8px;padding:0 4px}
  .inf .secs{column-count:2;column-gap:8px}
  .inf .secs table{margin-bottom:4px}
  .inf .secs tr{break-inside:avoid}
  .inf .secs th:first-child{width:22px!important} .inf .secs th:last-child{width:46px!important}
  .inf .secs td:first-child br{display:none} .inf .secs td .tag.crit{margin-left:1px}
  .inf .secs .fotos img{width:44px!important;height:34px!important}
  .inf .secs h2{break-after:avoid}
  .inf .fotos{gap:3px;margin-top:2px}
  .inf .fotos img{width:64px!important;height:48px!important}
  .inf .firmas td{height:34px!important}
  .inf p{margin:2px 0}
  .inf .ord{display:inline} .inf .ord+.ord:before{content:" · "}
}
.ord{display:block}
.orden{border-top:1px solid var(--linea);padding:8px 0}
.ord-tx{display:block;width:100%;text-align:left;border:1.5px dashed var(--verde);background:#fff;border-radius:9px;padding:9px 10px;min-height:44px;margin-bottom:6px}
.crono{float:right;font-weight:bold;color:var(--verde-osc);font-variant-numeric:tabular-nums} .crono.fin{color:var(--rojo)}
.nota3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nota3 button{border:1.5px solid var(--linea);background:#fff;border-radius:10px;padding:10px 4px;font-weight:bold;font-size:15px;min-height:54px;line-height:1.15}
.nota3 button small{display:block;font-weight:normal;font-size:12px}
.nota3 .b.on{background:var(--verde);border-color:var(--verde);color:#fff} .nota3 .r.on{background:var(--ambar);border-color:var(--ambar);color:#fff} .nota3 .n.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.pasos{margin:10px 14px 0;padding:8px 10px;border:1.5px solid var(--verde);border-radius:10px;background:var(--verde-s);font-size:13px;line-height:1.6}
.paso{display:inline-block;margin:2px 6px 2px 0;padding:1px 8px;border-radius:12px;background:#fff;border:1px solid var(--linea)}
.paso.on{background:var(--verde);color:#fff;border-color:var(--verde);font-weight:bold} .paso.ok{opacity:.55;text-decoration:line-through}
.pasos-barra{display:none;font-size:11px;line-height:1.5;margin-top:2px} .pasos-barra .paso{margin:0;padding:0 5px;font-size:11px}
.pts2{font-size:12px;line-height:1.25;text-align:right;white-space:nowrap}
.tabs button{padding:8px 4px;font-size:14px}
.tabs button small{font-size:11px}
.fila-ev{margin-bottom:8px}
.fila-ev .ev{margin-bottom:0}
.borrar-fila{text-align:right;padding:2px 4px 0}
.btn-borrar{border:0;background:none;color:var(--rojo);font-size:13px;text-decoration:underline;padding:6px 8px;min-height:32px}
.nota-sec{font-size:13px;color:var(--gris);padding:10px 14px 0}
</style>
</head>

function armarLista(secs) { var L = { secciones: secs, items: [], SEC: {} }; secs.forEach(function (s) { L.SEC[s.id] = s; s.items.forEach(function (it) { it.s = s.id; it.tipo = s.tipo; L.items.push(it); }); }); return L; }
var LISTA = armarLista(P.secciones), LISTA_OP10 = armarLista(P.secciones_op10 || P.secciones), LISTA_OP9 = armarLista(P.secciones_op9 || P.secciones);
/* versión de la lista de la sesión: 'OP-9' (también OP-8), 'OP-10' o la actual (OP-11, por puntos, sin críticas) */
function verLista(S) { var v = (S && S.plantilla) || ''; return /^OP-[89]$/.test(v) ? 'OP-9' : v === 'OP-10' ? 'OP-10' : 'actual'; }
function vieja(S) { return verLista(S) !== 'actual'; }
function lista(S) { var v = verLista(S); return v === 'OP-9' ? LISTA_OP9 : v === 'OP-10' ? LISTA_OP10 : LISTA; }

function itemPorId(S, id) { return itemsDe(S).filter(function (x) { return x.id === id; })[0]; }
function puntosLista(L) { return L.items.reduce(function (a, x) { return a + x.p; }, 0); }
var app = document.getElementById('app');
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmt(t) { if (!t) return ''; var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function nombre1(n) { var p = String(n || '').split(' ').filter(Boolean); return p.length >= 4 ? p[0] + ' ' + p[2] : p.length === 3 ? p[0] + ' ' + p[1] : p.join(' '); }

    img.onload = function () {

      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      var g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      var fs = Math.round(c.width / 45), sello = fmt(Date.now()); g.font = fs + 'px sans-serif';
      var tw = g.measureText(sello).width; g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(c.width - tw - 24, c.height - fs - 22, tw + 16, fs + 14);
      g.fillStyle = '#fff'; g.fillText(sello, c.width - tw - 16, c.height - 16);
      URL.revokeObjectURL(url); c.toBlob(function (b) { b ? ok(b) : mal(new Error('foto')); }, 'image/jpeg', 0.8);

/* ---------- Resultado de un piloto ---------- */

function retirado(S) { return !!S && S.estado === 'retirado'; }

/* 6 combinaciones nariz + desplazamiento (horizontal 10–15 m o vertical), la mayoría con la nariz desalineada; sin alejarse más de
   D.maximo_m del dronpuerto en cada eje; «Baja» solo después de «Sube»; nunca la misma secuencia que el compañero */
function sortearOrdenes(S, k) {
  /* N maniobras, todas combinaciones sorteadas (nariz con punto cardinal + desplazamiento horizontal de 10–15 m o vertical);
     sin regreso ni aterrizaje; verticales alternando «Sube» y «Baja» (nunca baja antes de subir); máximo D.maximo_m por eje;
     casi todas con la nariz hacia otro lado del desplazamiento; nunca la misma secuencia que el compañero */

    var x = 0, y = 0, z = 0, alineadas = 0, ok = true, prev = '', L = [], nv = 1 + Math.floor(Math.random() * Math.max(1, Math.floor(N / 4)));

      .then(function () { modal('<h2>Respaldo importado</h2><p>' + n + ' prueba' + (n === 1 ? '' : 's') + ' agregada' + (n === 1 ? '' : 's') + ' o actualizada' + (n === 1 ? '' : 's') + '.</p><div class="acciones"><button class="btn" id="m-no">Cerrar</button></div>'); $('#m-no').onclick = function () { cerrar(); inicio(); }; });
  };
  fr.readAsText(f);
}
function exportarCSV(L) {
  /* «Destreza (de 2N)»: si todas las filas tienen el mismo máximo va en el encabezado; si no, cada celda dice puntos/máximo */
  var maxes = []; L.forEach(function (S) { if (retirado(S)) return; evaluados(S).forEach(function (k) { if (S.ev[k].des) { var m = destreza(S, k).max; if (maxes.indexOf(m) < 0) maxes.push(m); } }); });
  var MAXC = maxes.length === 1 ? maxes[0] : maxes.length ? 0 : 2 * maniobrasAj(), DESHEAD = MAXC ? 'Destreza (de ' + MAXC + ')' : 'Destreza (puntos/máximo)';
  var cab = ['Piloto', 'Vuela', 'Observador', 'Tipo', 'Lugar', 'Dron', 'Evaluador', 'Lista', 'Inicio', 'Duración (min)', 'Estado', 'Puntaje', 'Resultado', 'Puntos obtenidos', 'Puntos posibles', 'Perdió', 'No aplica', DESHEAD, 'Destreza: puntos (de 10)', 'Miradas a la pantalla', 'Contingencia de su vuelo', 'Tarjeta como observador', 'Reporte que le corresponde', 'Observaciones'].concat(LISTA.items.map(function (it) { return 'P' + it.id; }));
  var filas = [cab];
  L.forEach(function (S) {
    /* OP-14: el piloto que se retiró sale en una fila sin puntaje (no cuenta como evaluado) */
    if (retirado(S)) { var R = S.retirado || {}, f = [R.nombre, R.rol === 'primero' ? '1.º' : '2.º', R.companero || '', S.tipo, S.lugar, S.dron, S.evaluador, S.plantilla, fmt(S.inicio), '', 'Retirado (incompleta)'];
      while (f.length < cab.length) f.push(''); f[cab.indexOf('Observaciones')] = 'Se retiró a las ' + fmt(R.hora).slice(11) + (R.reemplazo ? '; entró ' + R.reemplazo : '') + ' · ' + (R.respuestas || 0) + ' respuestas parciales'; filas.push(f); return; }
    evaluados(S).forEach(function (k) {
      var r = calcular(S, k), t1 = tarjetaDe(S, k, 'tp'), t2 = tarjetaDe(S, otro(k), 'to'), dx = S.ev[k].des ? destreza(S, k) : null, act = !vieja(S);
      filas.push([S[k], k === 'A' ? '1.º' : '2.º', nombreComp(S, k), S.tipo, S.lugar, S.dron, S.evaluador, S.plantilla, fmt(S.inicio), S.fin ? Math.round((S.fin - S.inicio) / 60000) : '', S.estado === 'final' ? 'Finalizada' : 'En curso',
        num(r.pts), S.estado === 'final' ? (r.aprobado ? 'Aprueba' : 'No aprueba') : '', act ? num(r.obtenidos) : '', act ? r.posibles : '', act ? perdioTxt(r).replace(/^Perdió: /, '').replace('No perdió puntos', '') : r.crit.map(function (x) { return 'crítica ' + x.id; }).join(' '), r.na,
        dx ? (dx.max === MAXC ? dx.pts : dx.pts + '/' + dx.max) : '', dx && act && dx.completa ? num(dx.puntos) : '', S.ev[k].des ? S.ev[k].des.mir : '',
        t1 ? t1.id + ' ' + t1.t : '', t2 ? t2.id + ' ' + t2.t : '', repEsperado(S, k) ? repTxt(repEsperado(S, k)) : '', S.ev[k].obs || '']
        /* P1… son las preguntas de OP-11 (puntos obtenidos, NA si no aplica); en sesiones anteriores quedan vacías (otra numeración) */
        .concat(LISTA.items.map(function (it) { if (!act) return ''; var q = r.preguntas.filter(function (x) { return x.id === it.id; })[0], e = (S.ev[k].items[it.id] || {}).e; return q.obtenido != null ? num(q.obtenido) : e === 'na' ? 'NA' : ''; })));
    });
  });
  var txt = '\ufeff' + filas.map(function (f) { return f.map(function (c) { c = String(c == null ? '' : c); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';'); }).join('\r\n');
  compartir(new File([txt], 'resumen_pruebas_operacionales_' + hoy() + '.csv', { type: 'text/csv' }));
}
