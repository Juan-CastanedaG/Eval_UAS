<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007934">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Evaluación operacional – Pilotos UAS EPM</title>
<style>
:root{
  --verde:#007934; --verde-osc:#005a27; --lima:#7AD400; --tinta:#17321F; --gris:#5b6b60; --linea:#d5e2d6;
  --neblina:#eef5ec; --papel:#fff; --rojo:#b3261e; --rojo-s:#fbeceb; --verde-s:#e3f3e8; --ambar:#c77700; --ambar-s:#fff3dc;
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--neblina);color:var(--tinta)}
body{font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lima);outline-offset:2px}
#top{background:var(--papel);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:10}
#top img{height:28px}
#top .tit{flex:1;line-height:1.15}
#top .tit b{display:block;font-size:15px}
#top .tit span{font-size:12px;color:var(--gris)}
#top .ver{font-size:11px;color:var(--gris)}
main{max-width:860px;margin:0 auto;padding:12px 12px 120px}
.hoja{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-bottom:12px}
h1{font-size:21px;margin:2px 0 8px;color:var(--verde-osc)}
h2{font-size:17px;margin:0 0 8px;color:var(--verde-osc)}
.sub{color:var(--gris);font-size:14px}
.btn{border:1.5px solid var(--verde);background:var(--papel);color:var(--verde-osc);border-radius:10px;padding:10px 16px;font-weight:bold;min-height:44px}
.btn.pri{background:var(--verde);color:#fff}
.btn.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn:disabled{opacity:.45}
.btn.chico{min-height:36px;padding:6px 12px;font-size:14px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1.5px solid var(--linea);border-radius:9px;padding:10px;background:#fff;color:var(--tinta);font-size:16px}
textarea{width:100%;resize:vertical}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.fila{grid-template-columns:1fr}}
.msg{border-radius:9px;padding:10px 12px;margin:8px 0;font-size:14px}
.msg.ok{background:var(--verde-s);color:var(--verde-osc)} .msg.err{background:var(--rojo-s);color:var(--rojo)} .msg.info{background:var(--ambar-s);color:#6b4500}
.lista .ev{display:flex;gap:10px;align-items:center;border:1px solid var(--linea);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;width:100%;text-align:left}
.ev .n{flex:1} .ev .n b{display:block} .ev .n span{font-size:13px;color:var(--gris)}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:bold;white-space:nowrap}
.tag.ok{background:var(--verde-s);color:var(--verde)} .tag.mal{background:var(--rojo-s);color:var(--rojo)} .tag.bor{background:var(--ambar-s);color:var(--ambar)} .tag.crit{background:var(--rojo-s);color:var(--rojo);font-size:11px;padding:1px 8px}
.pils{display:flex;flex-wrap:wrap;gap:6px}
.pil{border:1.5px solid var(--linea);background:#fff;border-radius:20px;padding:8px 14px;font-weight:bold}
.pil.on{background:var(--verde);border-color:var(--verde);color:#fff}
.sugerido{border:1.5px solid var(--linea);border-radius:10px;padding:8px 12px;background:#fff;text-align:left;width:100%;margin-bottom:6px}
.sugerido b{display:block}
.sugerido span{font-size:13px;color:var(--gris)}
/* evaluación */
#barra{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:9;background:var(--papel);border-bottom:1px solid var(--linea);padding:8px 14px;display:flex;gap:10px;align-items:center;font-size:14px}
#barra .prog{flex:1;height:8px;background:var(--linea);border-radius:4px;overflow:hidden}
#barra .prog i{display:block;height:100%;background:var(--verde)}
.sec{background:var(--papel);border:1px solid var(--linea);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sec>button.cab{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;padding:12px 14px;text-align:left;font-weight:bold;color:var(--verde-osc)}
.sec>button.cab .cnt{margin-left:auto;font-size:13px;color:var(--gris);font-weight:normal}
.sec .cuerpo{display:none;border-top:1px solid var(--linea)}
.sec.abierta .cuerpo{display:block}
.it{padding:12px 14px;border-bottom:1px solid var(--linea)}
.it:last-child{border-bottom:0}
.it .tx{margin-bottom:8px}
.it .tx small{color:var(--gris);margin-right:6px;font-weight:bold}
.est{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.est button{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:9px 4px;font-weight:bold;font-size:14px;min-height:44px}
.est .c.on{background:var(--verde);border-color:var(--verde);color:#fff}
.est .n.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.est .na.on{background:var(--gris);border-color:var(--gris);color:#fff}
.extra{display:flex;gap:8px;margin-top:8px;align-items:flex-start;flex-wrap:wrap}
.extra textarea{flex:1;min-width:200px;border:1.5px solid var(--linea);border-radius:9px;padding:8px;font-size:15px;min-height:42px}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fotos .f{position:relative}
.fotos img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--linea);display:block}
.fotos .x{position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--rojo);color:#fff;font-weight:bold;font-size:17px;line-height:32px;padding:0}
.camara{border:1.5px dashed var(--verde);background:#fff;color:var(--verde-osc);border-radius:9px;padding:8px 12px;font-weight:bold;min-height:42px}
.res{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.res .pts{font-size:52px;font-weight:bold;line-height:1;color:var(--verde-osc)} .res .pts.no{color:var(--rojo)}
.res .ver{font-size:20px;font-weight:bold}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:none;align-items:center;justify-content:center}
#visor.on{display:flex} #visor img{max-width:100%;max-height:100%}
#modal{position:fixed;inset:0;background:rgba(23,50,31,.5);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .caja{background:#fff;border-radius:14px;padding:18px;max-width:520px;width:100%}
/* informe */
.inf table{width:100%;border-collapse:collapse;font-size:14px}
.inf td,.inf th{border:1px solid var(--linea);padding:6px 8px;vertical-align:top;text-align:left}
.inf th{background:var(--neblina)}
.inf .ok{color:var(--verde);font-weight:bold} .inf .mal{color:var(--rojo);font-weight:bold} .inf .na{color:var(--gris)}
.inf .fotos img{width:150px;height:110px}
@media print{
  #top,#barra,.no-print{display:none!important}
  body{background:#fff} main{max-width:none;padding:0}
  .hoja{border:0;padding:0 0 10px}
  .inf .fotos img{width:170px;height:125px}
  .salto{page-break-before:always}
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;position:sticky;top:calc(92px + env(safe-area-inset-top,0px));z-index:8}
.tabs button{border:1.5px solid var(--verde);background:#fff;color:var(--verde-osc);border-radius:10px;padding:10px 6px;font-weight:bold;min-height:48px;line-height:1.2}
.tabs button.on{background:var(--verde);color:#fff}
.tabs button small{display:block;font-weight:normal;font-size:12px}
#fase{font-size:13px;color:var(--verde-osc);font-weight:bold}
#barra .t{font-variant-numeric:tabular-nums;font-weight:bold;font-size:18px}
#barra .t.aviso{color:var(--ambar)} #barra .t.fin{color:var(--rojo)}
.dato{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--gris)}
.dato input{width:90px;border:1.5px solid var(--linea);border-radius:9px;padding:8px;font-size:16px}
.tarj{border:1.5px solid var(--ambar);background:var(--ambar-s);border-radius:10px;padding:10px 12px;margin:10px 14px}
.tarj b{color:#6b4500}
.amb{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 14px 10px}
#mostrar{position:fixed;inset:0;z-index:60;background:var(--verde-osc);color:#fff;display:none;flex-direction:column;justify-content:center;padding:28px;text-align:center}
#mostrar.on{display:flex}
#mostrar .q{font-size:30px;font-weight:bold;line-height:1.3}
#mostrar .p{font-size:16px;opacity:.85;margin-bottom:18px}
#mostrar .c{font-size:14px;opacity:.7;margin-top:30px}
.solo-print{display:none} @media print{.solo-print{display:inline}}
[data-elige]{max-width:100%;min-width:0;text-overflow:ellipsis}
.inf .secs table{margin-bottom:6px}
@page{size:letter;margin:9mm 10mm}
@media print{
  .inf{font-size:10px;line-height:1.22}
  .inf h1{font-size:14px;margin:0 0 4px}
  .inf h2{font-size:11px;margin:5px 0 2px!important}
  .inf table{font-size:10px}
  .inf td,.inf th{padding:1px 4px}
  .inf .tarj{padding:3px 6px;margin:4px 0!important;font-size:10px;line-height:1.22}
  .inf .res{margin:4px 0 2px!important;gap:8px} .inf .res .pts{font-size:26px} .inf .res .ver{font-size:14px}
  .inf .msg{padding:3px 6px;margin:3px 0;font-size:10px}
  .inf .sub{font-size:9.5px}
  .inf .tag.crit{font-size:8px;padding:0 4px}
  .inf .secs{column-count:2;column-gap:8px}
  .inf .secs table{margin-bottom:4px}
  .inf .secs tr{break-inside:avoid}
  .inf .secs th:first-child{width:22px!important} .inf .secs th:last-child{width:46px!important}
  .inf .secs td:first-child br{display:none} .inf .secs td .tag.crit{margin-left:1px}
  .inf .secs .fotos img{width:44px!important;height:34px!important}
  .inf .secs h2{break-after:avoid}
  .inf .fotos{gap:3px;margin-top:2px}
  .inf .fotos img{width:64px!important;height:48px!important}
  .inf .firmas td{height:34px!important}
  .inf p{margin:2px 0}
  .inf .ord{display:inline} .inf .ord+.ord:before{content:" · "}
}
.ord{display:block}
.nota-sec{font-size:13px;color:var(--gris);padding:10px 14px 0}
</style>
</head>

<script>
'use strict';
var VERSION = 'EVAL-OP 9.1';
/* defensa contra caché mezclado: si llegó una plantilla de otra versión, se avisa en vez de fallar en silencio */
var PLANTILLA_ESPERADA = 'OP-9';
if (!window.PLANTILLA || window.PLANTILLA.version !== PLANTILLA_ESPERADA || !window.PLANTILLA.tarjetas_op8 || !window.PILOTOS) {
  document.getElementById('app').innerHTML = '<div class="msg err" style="font-size:22px;font-weight:bold;line-height:1.35;padding:22px;border:3px solid var(--rojo)">Versión mezclada: cierra la app, abre con señal y recarga.' +
    '<div style="font-size:14px;font-weight:normal;margin-top:10px">La app es ' + VERSION + ' y la lista cargada es ' + ((window.PLANTILLA && window.PLANTILLA.version) || 'ninguna') + ' (se esperaba ' + PLANTILLA_ESPERADA + '). Tus datos guardados no se han tocado.</div></div>';
  document.getElementById('ver').textContent = VERSION + ' · versión mezclada';
  throw new Error('Versión mezclada: plantilla ' + ((window.PLANTILLA && window.PLANTILLA.version) || 'ninguna') + ', se esperaba ' + PLANTILLA_ESPERADA);
}
var P = window.PLANTILLA, PILOTOS = window.PILOTOS || [], DRONES = window.DRONES || [], ITEMS = [], SEC = {};
P.secciones.forEach(function (s) { SEC[s.id] = s; s.items.forEach(function (it) { it.s = s.id; it.tipo = s.tipo; ITEMS.push(it); }); });
var app = document.getElementById('app');
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmt(t) { if (!t) return ''; var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function nombre1(n) { var p = String(n || '').split(' ').filter(Boolean); return p.length >= 4 ? p[0] + ' ' + p[2] : p.length === 3 ? p[0] + ' ' + p[1] : p.join(' '); }
function ajustes() { try { return JSON.parse(localStorage.getItem('evop:aj')) || {}; } catch (e) { return {}; } }
function guardarAjustes(a) { localStorage.setItem('evop:aj', JSON.stringify(a)); }
function notaMin() { var a = ajustes(); return a.nota != null ? +a.nota : 90; }
function hoy() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
$('#ver').textContent = VERSION + ' · ' + P.version;

/* ---------- Base de datos local (IndexedDB) ---------- */
var DB;
function abrir() {
  return new Promise(function (ok, mal) {
    var r = indexedDB.open('evop3', 1);
    r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('ses', { keyPath: 'id' }); d.createObjectStore('fotos'); };
    r.onsuccess = function () { DB = r.result; ok(); }; r.onerror = function () { mal(r.error); };
  });
}
function tx(st, modo, fn) {
  return new Promise(function (ok, mal) {
    var t = DB.transaction(st, modo), s = t.objectStore(st), out = fn(s);
    t.oncomplete = function () { ok(out && out.result !== undefined ? out.result : out); }; t.onerror = function () { mal(t.error); };
  });
}
function todas() { return tx('ses', 'readonly', function (s) { return s.getAll(); }); }

/* Fotos: 1600 px, JPEG 0,8, con sello de fecha y hora */
function comprimir(file) {
  return new Promise(function (ok, mal) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      var g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      var fs = Math.round(c.width / 45), sello = fmt(Date.now()); g.font = fs + 'px sans-serif';
      var tw = g.measureText(sello).width; g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(c.width - tw - 24, c.height - fs - 22, tw + 16, fs + 14);
      g.fillStyle = '#fff'; g.fillText(sello, c.width - tw - 16, c.height - 16);
      URL.revokeObjectURL(url); c.toBlob(function (b) { b ? ok(b) : mal(new Error('foto')); }, 'image/jpeg', 0.8);
    };
    img.onerror = function () { URL.revokeObjectURL(url); mal(new Error('No se pudo leer la foto')); };
    img.src = url;
  });
}
var URLS = {};

/* ---------- Resultado de un piloto ---------- */
function calcular(S, k) {
  var sum = 0, max = 0, c = 0, n = 0, na = 0, pend = 0, crit = [], it = S.ev[k].items;
  ITEMS.forEach(function (x) {
    var e = (it[x.id] || {}).e;
    if (e === 'c') { c++; sum += x.p; max += x.p; } else if (e === 'n') { n++; max += x.p; if (x.c) crit.push(x); } else if (e === 'na') na++; else pend++;
  });
  var pts = max ? Math.round(1000 * sum / max) / 10 : 0;
  return { c: c, n: n, na: na, pend: pend, crit: crit, pts: pts, nota: S.nota, aprobado: !crit.length && !pend && pts >= S.nota };
}
function otro(k) { return k === 'A' ? 'B' : 'A'; }
/* ---------- Prueba de destreza: vuelo sin pantalla con órdenes dictadas ---------- */
var D = P.destreza;
function sortearOrdenes(S, k) {
  var otra = (S.ev[otro(k)].des || {}).ord || [], pick = function (tipo) { var o = D.ordenes[tipo], ops = o.filter(function (x) { return otra.indexOf(x) < 0; }); if (!ops.length) ops = o; return ops[Math.floor(Math.random() * ops.length)]; };
  var med = D.tipos.filter(function (t) { return t[0] !== 'regreso'; }).map(function (t) { return pick(t[0]); });
  for (var i = med.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = med[i]; med[i] = med[j]; med[j] = t; }
  var ord = med.concat([pick('regreso'), D.final]);
  S.ev[k].des = { ord: ord, c: ord.map(function () { return [0, 0, 0]; }), rep: ord.map(function () { return false; }), mir: 0, inter: false };
}
function destreza(S, k) {
  var d = S.ev[k].des;
  if (!d) return { pts: 0, max: 0, completa: false, ok: false };
  var pts = 0, comp = true;
  d.c.forEach(function (cr, i) { var p = cr.filter(function (x) { return x === 1; }).length; if (d.rep[i]) p = Math.max(0, p - 1); pts += p; if (cr.indexOf(0) >= 0) comp = false; });
  var completa = comp || d.inter, ok = completa && !d.inter && pts >= D.minimo && d.mir <= D.miradas;
  return { pts: pts, max: d.ord.length * 3, completa: completa, ok: ok, mir: d.mir, inter: d.inter };

function aplicarDestreza(S, k) {

  r.e = d.completa ? (d.ok ? 'c' : 'n') : ''; r.t = Date.now();
}

function tarjetaDe(S, k) { var e = S.ev[k]; if (!e.tp) return null; return e.tarjeta && e.tarjeta.id === e.tp ? e.tarjeta : buscarTarjeta(e.tp); }

/* ---------- Resumen estable por piloto para el informe único (esquema evop-resumen-1) ---------- */
function iso(t) {
  if (!t) return null; var d = new Date(t), o = -d.getTimezoneOffset(), a = Math.abs(o);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + (o < 0 ? '-' : '+') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
}

      lugar: S.lugar || '', dron: S.dron || '', tipo: S.tipo || '', evaluador: S.evaluador || '', plantilla: S.plantilla || '',

      obst: S.obst === '' || S.obst == null ? null : +S.obst, rth: e.rth === '' || e.rth == null ? null : +e.rth, observaciones: e.obs || '' };

/* ---------- Nueva prueba ---------- */

    .sort(function (a, b) { return a.turnos[0].ini.localeCompare(b.turnos[0].ini) || a.nombre.localeCompare(b.nombre); });
  todas().then(function (L) { L.forEach(function (S) { hechos[S.A] = hechos[S.B] = S.estado === 'final' ? 'Evaluado' : 'En curso'; }); dibujar(null); });

    var lista = f ? PILOTOS.filter(function (p) { return norm(p.nombre).indexOf(f) >= 0 && p.nombre !== sel.A; }).slice(0, 12) : [];
    var pares = [];
    if (!sel.A) deHoy.forEach(function (p) { if (p.pareja && pares.some(function (x) { return x[1] === p.nombre; })) return; pares.push([p.nombre, p.pareja || '', p.turnos.filter(function (t) { return t.ini.slice(0, 10) === hoy(); })[0]]); });

  $('[data-elige]').onchange = function () { if (this.value) poner(this.value); };
  if ($('[data-mos]')) $('[data-mos]').onclick = function () {
    var t = tarjetaDe(S, k), q = quienTarjeta(S, k, t);
    var m = $('#mostrar'); m.innerHTML = '<div class="p">' + esc(nombre1(q)) + ' (' + t.para + ')</div><div class="q">' + esc(t.situacion) + '</div><div class="c">Toca la pantalla para cerrar</div>';
    m.classList.add('on'); m.onclick = function () { m.classList.remove('on'); };
  };
}
function enlazarFotos(S, k, raiz) {
  Array.prototype.forEach.call(raiz.querySelectorAll('[data-borra]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation(); var fid = b.getAttribute('data-borra');
      modal('<h2>¿Borrar la foto?</h2><div class="acciones"><button class="btn peligro" id="m-si">Borrar</button><button class="btn" id="m-no">Cancelar</button></div>');
      $('#m-no').onclick = cerrar;
      $('#m-si').onclick = function () {
        cerrar(); S.fotosGen = (S.fotosGen || []).filter(function (x) { return x !== fid; });
        ['A', 'B'].forEach(function (q) { var it = S.ev[q].items; Object.keys(it).forEach(function (i) { if (it[i].fotos) it[i].fotos = it[i].fotos.filter(function (x) { return x !== fid; }); }); });
        borrarFoto(fid).then(function () { return guardarS(S); }).then(function () { b.parentNode.remove(); });
      };
    };
  });
  Array.prototype.forEach.call(raiz.querySelectorAll('img[data-foto]'), function (im) { im.onclick = function () { $('#visor-img').src = im.src; $('#visor').classList.add('on'); }; });
}
function agregarFoto(S, k, id, file) {
  if (!file) return;
  comprimir(file).then(function (blob) {
    var fid = 'f' + uid();
    return guardarFoto(fid, blob).then(function () {
      if (id) { var it = ITEMS.filter(function (x) { return x.id === id; })[0]; quienes(S, k, it).forEach(function (q) { var r = S.ev[q].items[id] || (S.ev[q].items[id] = {}); (r.fotos = r.fotos || []).push(fid); }); }
      else (S.fotosGen = S.fotosGen || []).push(fid);
      return guardarS(S);
    }).then(function () { var c = id ? $('#it-' + id + ' .fotos') : $('#fg'); c.insertAdjacentHTML('beforeend', fotoHtml(fid)); pintarFotos(c); enlazarFotos(S, k, c); });
  }).catch(function (er) { modal('<h2>No se pudo guardar la foto</h2><p>' + esc(er.message) + '</p><div class="acciones"><button class="btn" id="m-no">Cerrar</button></div>'); $('#m-no').onclick = cerrar; });
}
function terminar(S, k) {
  guardarS(S);
  var falt = [];
  ['A', 'B'].forEach(function (q) { ITEMS.forEach(function (it) { if (!(S.ev[q].items[it.id] || {}).e) falt.push([q, it]); }); });
  if (falt.length) {
    modal('<h2>Faltan ' + falt.length + ' ítems por evaluar</h2><p>Responde cada pregunta (sí, no o no aplica) para los dos pilotos; la de destreza se responde al terminar las órdenes.</p><p class="sub">' +
      falt.slice(0, 8).map(function (x) { return esc(nombre1(S[x[0]])) + ' – ' + x[1].id + ' ' + esc(x[1].t); }).join('<br>') + (falt.length > 8 ? '<br>…' : '') + '</p>' +
      '<div class="acciones"><button class="btn pri" id="m-ir">Ir al primero</button><button class="btn" id="m-no">Cerrar</button></div>');
    $('#m-no').onclick = cerrar;
    $('#m-ir').onclick = function () { cerrar(); var q = falt[0][0], it = falt[0][1]; ABIERTA[it.s] = true; evaluar(S, q); setTimeout(function () { $('#it-' + it.id).scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50); };
    return;
  }
  var res = ['A', 'B'].map(function (q) { var r = calcular(S, q); return '<p><b>' + esc(S[q]) + ':</b> <span style="font-size:22px;font-weight:bold;color:' + (r.aprobado ? 'var(--verde)' : 'var(--rojo)') + '">' + r.pts + ' – ' + (r.aprobado ? 'aprueba' : 'no aprueba') + '</span>' + (r.crit.length ? '<br><span class="sub">Críticos incumplidos: ' + r.crit.map(function (x) { return x.id; }).join(', ') + '</span>' : '') + '</p>'; }).join('');
  modal('<h2>Resultados</h2>' + res + '<p class="sub">Nota mínima: ' + S.nota + '. Al cerrar, la prueba queda finalizada y ya no se puede editar; solo el registro del reporte de cada piloto (se puede marcar después).</p><div class="acciones"><button class="btn pri" id="m-cer">Cerrar la prueba</button><button class="btn" id="m-no">Seguir editando</button></div>');
  $('#m-no').onclick = cerrar;
  $('#m-cer').onclick = function () {
    cerrar(); S.estado = 'final'; S.fin = Date.now();
    S.resultado = {}; ['A', 'B'].forEach(function (q) { var r = calcular(S, q); S.resultado[q] = { pts: r.pts, aprobado: r.aprobado, crit: r.crit.map(function (x) { return x.id; }) }; });
    S.resumen = resumen(S);
    guardarS(S).then(function () { informe(S); });
  };
}
$('#visor').onclick = function () { this.classList.remove('on'); };
function modal(h) { $('#modal-c').innerHTML = h; $('#modal').classList.add('on'); }
function cerrar() { $('#modal').classList.remove('on'); }

/* ---------- Informe (una hoja por piloto; se imprime o se guarda en PDF) ---------- */
var ESTX = { c: ['Sí', 'ok'], n: ['No', 'mal'], na: ['No aplica', 'na'] };
function informePiloto(S, k, primero) {
  var r = calcular(S, k), e = S.ev[k], dur = S.fin ? Math.round((S.fin - S.inicio) / 60000) : '';
  return '<div class="hoja inf' + (primero ? '' : ' salto') + '"><h1>Prueba operacional – Pilotos UAS</h1>' +
    '<table><tr><th>Piloto evaluado</th><td>' + esc(S[k]) + '</td><th>Vuela</th><td>' + (k === 'A' ? 'Primero' : 'Segundo') + '</td></tr>' +
    '<tr><th>Compañero (observador)</th><td>' + esc(S[otro(k)]) + '</td><th>Tipo de operación</th><td>' + esc(S.tipo) + '</td></tr>' +
    '<tr><th>Lugar</th><td>' + esc(S.lugar || '–') + (S.gps ? '<br><span class="sub">' + S.gps.join(', ') + '</span>' : '') + '</td><th>Dron</th><td>' + esc(S.dron || '–') + '</td></tr>' +
    '<tr><th>Inicio</th><td>' + fmt(S.inicio) + '</td><th>Duración</th><td>' + (dur !== '' ? dur + ' min' : '–') + '</td></tr>' +
    '<tr><th>Obstáculo más alto</th><td>' + (S.obst !== '' ? S.obst + ' m' : '–') + '</td><th>Altura de RTH</th><td>' + (e.rth !== '' ? e.rth + ' m' : '–') + '</td></tr>' +
    '<tr><th>Evaluador</th><td>' + esc(S.evaluador || '–') + '</td><th>Lista</th><td>' + esc(S.plantilla) + '</td></tr></table>' +
    '<div class="res" style="margin:14px 0 6px"><span class="pts' + (r.aprobado ? '' : ' no') + '">' + r.pts + '</span><span class="ver" style="color:' + (r.aprobado ? 'var(--verde)' : 'var(--rojo)') + '">' + (r.aprobado ? 'Aprueba' : 'No aprueba') + '</span>' +
    '<span class="sub">' + r.c + ' sí · ' + r.n + ' no · ' + r.na + ' no aplica · nota mínima ' + r.nota + '</span></div>' +
    (r.crit.length ? '<div class="msg err">Incumplió ítems críticos: ' + r.crit.map(function (it) { return it.id + ' – ' + esc(it.t); }).join('; ') + '.</div>' : '') +
    tarjetasDe(S, k).map(function (t) { return '<div class="tarj" style="margin:10px 0"><b>Contingencia en su vuelo: ' + esc(t.id) + ' · ' + esc(t.t) + '</b> (se le mostró al ' + t.para + ': ' + esc(t.para === 'observador' ? S[otro(k)] : S[k]) + ')<br><span class="sub">Situación:</span> ' + esc(t.situacion) + '<br><span class="sub">Lo correcto:</span> ' + esc(t.espera) + '<br><span class="sub">Reporte esperado:</span> <b>' + repTxt(t.reporte_esperado) + '</b> <span class="sub">(texto del escenario: ' + esc(t.reporte) + ')</span></div>'; }).join('') +
    reporteHtml(S, k) +
    (function () { var d = e.des, x = destreza(S, k); if (!d) return ''; return '<div class="tarj" style="margin:10px 0;border-color:var(--verde);background:var(--verde-s)"><b>Destreza (vuelo sin pantalla): ' + x.pts + ' de ' + x.max + ' · ' + d.mir + ' miradas' + (d.inter ? ' · con intervención de seguridad' : '') + ' – ' + (x.ok ? 'aprobada' : 'no aprobada') + '</b>' +
      d.ord.map(function (o, i) { var p = d.c[i].filter(function (v) { return v === 1; }).length; if (d.rep[i]) p = Math.max(0, p - 1); return '<span class="ord">' + (i + 1) + '. ' + esc(o) + ' – <b>' + p + '/3</b>' + (d.rep[i] ? ' (repetida)' : '') + d.c[i].map(function (v, j) { return v === 2 ? ', falló: ' + D.criterios[j].toLowerCase() : ''; }).join('') + '</span>'; }).join('') + '</div>'; })() +
    '<div class="secs">' + P.secciones.map(function (s) {
      return '<h2 style="margin-top:14px">' + s.id + '. ' + esc(tituloSec(S, k, s)) + '</h2><table><tr><th style="width:34px">#</th><th>Pregunta (puntos)</th><th style="width:80px">Respuesta</th></tr>' +
        s.items.map(function (it) {
          var x = e.items[it.id] || {}, st = ESTX[x.e] || ['Sin evaluar', 'na'];
          return '<tr><td>' + it.id + (it.c ? '<br><span class="tag crit">C</span>' : '') + '</td><td>' + esc(it.t) + ' <span class="sub">(' + it.p + ')</span>' + (x.nota ? '<br><i>' + esc(x.nota) + '</i>' : '') +
            ((x.fotos || []).length ? '<div class="fotos">' + x.fotos.map(function (f) { return '<img data-foto="' + f + '" alt="Foto">'; }).join('') + '</div>' : '') + '</td><td class="' + st[1] + '">' + st[0] + '</td></tr>';
        }).join('') + '</table>';
    }).join('') + '</div>' +
    '<h2 style="margin-top:14px">Observaciones</h2><p>' + (e.obs ? esc(e.obs).replace(/\n/g, '<br>') : '–') + '</p>' +
    (S.obs ? '<p class="sub">Generales de la prueba: ' + esc(S.obs).replace(/\n/g, '<br>') + '</p>' : '') +
    ((S.fotosGen || []).length ? '<div class="fotos">' + S.fotosGen.map(function (f) { return '<img data-foto="' + f + '" alt="Foto">'; }).join('') + '</div>' : '') +
    '<table class="firmas" style="margin-top:30px"><tr><td style="height:70px;width:50%">Firma del evaluador</td><td>Firma del piloto evaluado</td></tr></table></div>';
}
function informe(S) {
  $('#barra').style.display = 'none'; clearInterval(TICK);
  app.innerHTML = '<div class="hoja no-print"><div class="acciones" style="margin:0"><button class="btn pri" id="i-pdf">Imprimir / guardar PDF</button><button class="btn" id="i-comp">Compartir respaldo</button><button class="btn" id="i-vol">Volver</button></div></div>' +
    informePiloto(S, 'A', true) + informePiloto(S, 'B', false);
  pintarFotos(app); enlazarReportes(S, app);
  $('#i-pdf').onclick = function () { document.title = 'Prueba operacional – ' + S.A + ' y ' + S.B; window.print(); document.title = 'Evaluación operacional – Pilotos UAS EPM'; };
  $('#i-vol').onclick = inicio; $('#i-comp').onclick = function () { exportar([S]); };
}

/* ---------- Respaldo y resumen ---------- */
function blobADataURL(b) { return new Promise(function (ok) { var fr = new FileReader(); fr.onload = function () { ok(fr.result); }; fr.readAsDataURL(b); }); }
function compartir(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: file.name }).catch(function () {});
  else { var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500); }
}
function exportar(L) {
  if (!L.length) { modal('<h2>No hay pruebas</h2><div class="acciones"><button class="btn" id="m-no">Cerrar</button></div>'); $('#m-no').onclick = cerrar; return; }
  var fotos = {}, ids = []; L.forEach(function (S) { ids = ids.concat(fotosDe(S)); });
  Promise.all(ids.map(function (id) { return leerFoto(id).then(function (b) { return b ? blobADataURL(b).then(function (u) { fotos[id] = u; }) : null; }); })).then(function () {
    var nom = 'pruebas_operacionales_' + hoy() + (L.length === 1 ? '_' + norm(L[0].A + ' ' + L[0].B).replace(/[^a-z0-9]+/g, '_') : '') + '.json';
    /* el resumen por piloto se recalcula al exportar (también para sesiones de EVAL-OP 8 importadas) */
    var ses = L.map(function (S) { return S.estado === 'final' ? Object.assign({}, S, { resumen: resumen(S) }) : S; });
    compartir(new File([JSON.stringify({ app: 'evop3', esquema: 'evop-resumen-1', version: VERSION, exportado: Date.now(), sesiones: ses, fotos: fotos })], nom, { type: 'application/json' }));
  });
}
function importar(f) {
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    var d; try { d = JSON.parse(fr.result); } catch (e) { d = null; }
    if (!d || d.app !== 'evop3') { modal('<h2>Archivo no válido</h2><p>No es un respaldo de esta versión de la app.</p><div class="acciones"><button class="btn" id="m-no">Cerrar</button></div>'); $('#m-no').onclick = cerrar; return; }
    var n = 0;
    Promise.all(Object.keys(d.fotos || {}).map(function (id) { return fetch(d.fotos[id]).then(function (r) { return r.blob(); }).then(function (b) { return guardarFoto(id, b); }); }))
      .then(function () { return Promise.all(d.sesiones.map(function (S) { return leerS(S.id).then(function (y) { if (!y || (S.actualizado || 0) > (y.actualizado || 0)) { n++; if (S.estado === 'final' && S.ev && S.ev.A && S.ev.B) S.resumen = resumen(S); return tx('ses', 'readwrite', function (s) { s.put(S); }); } }); })); })
      .then(function () { modal('<h2>Respaldo importado</h2><p>' + n + ' prueba' + (n === 1 ? '' : 's') + ' agregada' + (n === 1 ? '' : 's') + ' o actualizada' + (n === 1 ? '' : 's') + '.</p><div class="acciones"><button class="btn" id="m-no">Cerrar</button></div>'); $('#m-no').onclick = function () { cerrar(); inicio(); }; });
  };
  fr.readAsText(f);
}
function exportarCSV(L) {
  var cab = ['Piloto', 'Vuela', 'Observador', 'Tipo', 'Lugar', 'Dron', 'Evaluador', 'Inicio', 'Duración (min)', 'Estado', 'Puntaje', 'Resultado', 'Críticas incumplidas', 'Sí', 'No', 'No aplica', 'Obstáculo (m)', 'RTH (m)', 'Destreza (de 24)', 'Miradas a la pantalla', 'Intervención', 'Contingencia de su vuelo', 'Reporte esperado', 'Reporte hecho', 'Fecha del registro del reporte', 'Nota del reporte', 'Observaciones'].concat(ITEMS.map(function (it) { return 'P' + it.id; }));
  var filas = [cab];
  L.forEach(function (S) {
    ['A', 'B'].forEach(function (k) {
      var r = calcular(S, k), ts = tarjetasDe(S, k);
      filas.push([S[k], k === 'A' ? '1.º' : '2.º', S[otro(k)], S.tipo, S.lugar, S.dron, S.evaluador, fmt(S.inicio), S.fin ? Math.round((S.fin - S.inicio) / 60000) : '', S.estado === 'final' ? 'Finalizada' : 'En curso',
        r.pts, S.estado === 'final' ? (r.aprobado ? 'Aprueba' : 'No aprueba') : '', r.crit.map(function (x) { return x.id; }).join(' '), r.c, r.n, r.na, S.obst, S.ev[k].rth, S.ev[k].des ? destreza(S, k).pts : '', S.ev[k].des ? S.ev[k].des.mir : '', S.ev[k].des && S.ev[k].des.inter ? 'Sí' : '', ts.map(function (t) { return t.t + ' (' + t.para + ')'; }).join(' / '), repTxt(repEsperado(S, k)).replace('–', ''), REPCSV[repEstado(S, k)], fmt(repDe(S, k).fecha), repDe(S, k).nota || '', S.ev[k].obs || '']
        .concat(ITEMS.map(function (it) { var x = (S.ev[k].items[it.id] || {}).e; return x === 'c' ? it.p : x === 'n' ? 0 : x === 'na' ? 'NA' : ''; })));
    });
  });
  var txt = '\ufeff' + filas.map(function (f) { return f.map(function (c) { c = String(c == null ? '' : c); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';'); }).join('\r\n');
  compartir(new File([txt], 'resumen_pruebas_operacionales_' + hoy() + '.csv', { type: 'text/csv' }));
}

/* ---------- Arranque ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
abrir().then(inicio).catch(function (e) { app.innerHTML = '<div class="msg err">No se pudo abrir el almacenamiento del celular: ' + esc(e && e.message) + '</div>'; });
</script>
